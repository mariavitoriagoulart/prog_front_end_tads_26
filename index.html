<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e1014">
    <meta name="description" content="Acesse os projetos desenvolvidos na disciplina de Programação Front-end.">
    <title>Projetos | Front-end TADS</title>
    <link rel="icon" href="tecboard/favicon-tecboard-roxo.svg" type="image/svg+xml">
    <style>
        @font-face {
            font-family: "Poppins";
            src: url("tecboard/fonts/Poppins/Poppins-Bold.ttf") format("truetype");
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: "Roboto";
            src: url("tecboard/fonts/Roboto/Roboto-VariableFont_wdth,wght.ttf") format("truetype");
            font-weight: 100 900;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 24px;
            background: #0e1014;
            color: #fff;
            font-family: "Roboto", Arial, sans-serif;
        }

        main {
            width: min(100%, 900px);
            margin: 0 auto;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #b98aff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: "Poppins", sans-serif;
            font-size: clamp(36px, 7vw, 64px);
            line-height: 1.1;
        }

        h1 span {
            color: #9747ff;
        }

        .intro {
            max-width: 600px;
            margin: 20px 0 40px;
            color: #c5c6cc;
            font-size: 18px;
            line-height: 1.6;
        }

        h2 {
            margin: 0 0 16px;
            font-family: "Poppins", sans-serif;
            font-size: 22px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
            gap: 16px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .project-link {
            display: block;
            height: 100%;
            padding: 24px;
            border: 1px solid #34313c;
            border-radius: 16px;
            background: #17191f;
            color: inherit;
            text-decoration: none;
            transition: border-color 160ms ease, transform 160ms ease;
        }

        .project-link:hover,
        .project-link:focus-visible {
            transform: translateY(-3px);
            border-color: #9747ff;
            outline: none;
        }

        .project-link h3 {
            margin: 0 0 8px;
            font-family: "Poppins", sans-serif;
            font-size: 20px;
        }

        .project-link p {
            margin: 0;
            color: #c5c6cc;
            line-height: 1.5;
        }

        .arrow {
            display: inline-block;
            margin-top: 20px;
            color: #b98aff;
            font-weight: 700;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Programação Front-end · TADS 2026</p>
        <h1>Explore os <span>projetos</span></h1>
        <p class="intro">Uma coleção de projetos desenvolvidos durante a disciplina. Escolha um para acessar.</p>

        <section aria-labelledby="projects-heading">
            <h2 id="projects-heading">Projetos disponíveis</h2>
            <ul class="projects">
                <li>
                    <a class="project-link" href="tecboard/index.html">
                        <h3>Tecboard</h3>
                        <p>Monitoramento em tempo real com alertas inteligentes.</p>
                        <span class="arrow">Acessar projeto <span aria-hidden="true">→</span></span>
                    </a>
                </li>
                <!-- Adicione novos projetos como links para suas respectivas subpastas. -->
            </ul>
        </section>
    </main>
</body>
</html>
